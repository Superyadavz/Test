<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff4e8a, #ff9ecb);
      overflow: hidden;
      text-align: center;
      color: white;
    }

    .box {
      background: rgba(0,0,0,0.25);
      padding: 30px 40px;
      border-radius: 20px;
      position: relative;
      z-index: 3;
    }

    button {
      padding: 10px 18px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.3s ease;
    }

    #no {
      position: fixed;
      transition: left 0.5s ease, top 0.5s ease;
    }

    #roses {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 1;
    }

    #finalMsg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      font-weight: bold;
      display: none;
      z-index: 4;
    }

    /* hearts */
    .heart {
      position: fixed;
      top: -10px;
      font-size: 20px;
      animation: fall linear forwards;
      z-index: 2;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
      }
    }
  </style>
</head>

<body>

  <!-- roses -->
  <img id="roses" src="https://images.unsplash.com/photo-1518623489648-a173ef7824f3">

  <!-- final message -->
  <div id="finalMsg">I LOVE YOU ❤️</div>

  <div class="box">
    <h1>Will you be my Valentine, Shivani? ❤️</h1>
    <button id="yesBtn" onclick="yes()">Yes</button>
    <button id="no">No</button>
  </div>

  <!-- music -->
  <audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yesBtn");
    let scale = 1;

    document.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();

      const distanceX = Math.abs(e.clientX - (rect.left + rect.width / 2));
      const distanceY = Math.abs(e.clientY - (rect.top + rect.height / 2));

      if (distanceX < 120 && distanceY < 80) {
        const x = Math.random() * (window.innerWidth - rect.width);
        const y = Math.random() * (window.innerHeight - rect.height);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        // grow YES button
        scale += 0.1;
        yesBtn.style.transform = `scale(${scale})`;
      }
    });

    function yes() {
      document.getElementById("roses").style.display = "block";
      document.getElementById("finalMsg").style.display = "block";
      document.getElementById("music").play();
      startHearts();
    }

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
      }, 200);
    }
  </script>

</body>
</html>
